openapi: 3.0.3

info:
  title: E-Mobility API
  version: 1.0.0
  description: |
    REST side of the E-Mobility route planning backend: sign-in, session renewal and file
    downloads. Everything else — experiments, depots, configurations, vehicles and parameters —
    is served by one GraphQL endpoint, `POST /api/v1/graphql`, which is explored at
    [`/altair`](/altair/).

    ## Response envelope

    Every REST route under `/api/v1` wraps its payload in the same envelope:

    ```json
    { "status": 200, "message": "Login successful! Welcome back.", "data": {} }
    ```

    `status` repeats the HTTP status code and `data` is `null` on errors. An error adds a
    machine-readable `code`:

    ```json
    { "status": 401, "message": "Access token has expired.", "data": null, "code": "token_expired" }
    ```

    `code` is one of `invalid_request`, `bad_request`, `no_token`, `token_expired`,
    `token_invalid`, `invalid_credentials`, `forbidden`, `not_found`, `conflict`,
    `rate_limited`, `payload_too_large` or `internal_error`.

    ## Authentication

    Every route except the sign-in routes (`/auth/register`, `/auth/login`, `/auth/demo`,
    `/auth/refresh`, `/auth/logout`) needs an access token, GraphQL and file downloads included:

    ```
    Authorization: Bearer <accessToken>
    ```

    Access tokens are HS256-signed JWTs that expire after 15 minutes (`ACCESS_TOKEN_EXPIRY`).
    The web app keeps the token in memory only.

    The **refresh token is never in a response body**. The sign-in routes set it as a cookie
    JavaScript cannot read, scoped to the auth routes:

    ```
    Set-Cookie: refreshToken=…; HttpOnly; SameSite=Strict; Path=/api/v1/auth; Max-Age=604800
    ```

    Browser clients therefore send those requests with credentials (`withCredentials`). Under
    `ENV=production` the cookie is `Secure; SameSite=None`, because the web app and the API are
    served from different sites. Refresh tokens last 7 days (`REFRESH_TOKEN_EXPIRY_DAYS`) and
    rotate on every `POST /auth/refresh`: the token sent is retired as it is exchanged, and
    presenting a retired token again revokes that whole session.

    ## Roles and tenancy

    An account has the role `BRS` (planner) or `Admin`, and belongs to one company. The role and
    the company are read from the database on every request, never from the token or the request
    body, and every query is scoped to that company. Self-registration always creates a `BRS`
    account in the demo company.

    ## Rate limits

    - Sign-in routes: `AUTH_RATE_LIMIT` (default 30) requests per IP per 15 minutes.
    - Every other route: `API_RATE_LIMIT` (default 1000) requests per IP per 15 minutes.

    Both answer `429` with the envelope and `code: "rate_limited"`.

    ## Errors

    `5xx` responses are deliberately opaque: the server logs the real error and returns
    `"Internal Server Error"`. Every response carries an `X-Request-Id` header that matches the
    server log entry.

servers:
  - url: /
    description: This server

tags:
  - name: Auth
    description: Accounts and sessions
  - name: Files
    description: Stored order files, configuration files and plan results
  - name: GraphQL
    description: The single endpoint behind the web app's data
  - name: Health

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness and database check
      security: []
      responses:
        '200':
          description: The API and its database are reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        '503':
          description: The database cannot be reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: unavailable }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Create a planner account and sign in
      description: |
        The new account joins the demo company with the role `BRS`. A `role` or company sent in
        the body is ignored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Account created; the refresh cookie is set
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '409':
          description: The username is taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { status: 409, message: Username already exists, data: null, code: conflict }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with a username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Signed in; the refresh cookie is set
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401':
          description: Unknown username or wrong password (the two are not told apart)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                { status: 401, message: Invalid username or password, data: null, code: invalid_credentials }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/demo:
    post:
      tags: [Auth]
      summary: Sign in as the shared demo account
      description: |
        Guest entry for visitors: no body and no password. It issues an ordinary session for the
        seeded demo account (`DEMO_USERNAME`), so the visitor then uses the API with an access
        token like any other user. Answers `404` when `DEMO_LOGIN_ENABLED=false` or the demo
        account has not been seeded.
      security: []
      responses:
        '200':
          description: Signed in to the demo workspace; the refresh cookie is set
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange the refresh cookie for a new access token
      description: |
        Reads the `refreshToken` cookie, retires it and sets a new one. A retired token that is
        presented again (outside a 10-second grace for parallel tabs) revokes every token of that
        session.
      security: []
      responses:
        '200':
          description: A new access token; the refresh cookie is replaced
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401':
          description: The cookie is missing, expired, revoked or was already used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                { status: 401, message: Invalid or expired refresh token, data: null, code: token_invalid }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: End this session
      description: Revokes the session of the refresh cookie and clears the cookie. Always answers `200`.
      security: []
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }

  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: End every session of this account
      responses:
        '200':
          description: All refresh tokens of the account are revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: The signed-in account
      responses:
        '200':
          description: The account behind the access token, as stored now
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: integer, example: 200 }
                  message: { type: string, example: User fetched successfully. }
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/files/{key}:
    get:
      tags: [Files]
      summary: Download a stored file
      description: |
        `key` is the storage key GraphQL returns in its `fileUrl` fields, slashes included, e.g.
        `companies/<companyId>/experiments/<runId>/plan/geoJson.json`. The file is read from the
        configured store (local disk or Cloudflare R2) and streamed back.

        Only keys under the caller's own company are served; any other key answers `404`, as if
        the file did not exist.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
          example: companies/9d6c1f0e-2a53-4a5e-8f55-0f2f6d3b1c11/experiments/5f0a7c1e-8f1b-4a36-9f0b-1c2d3e4f5a6b/plan/vrpStats.json
      responses:
        '200':
          description: 'The file, sent as an attachment with `Cache-Control: private, no-store`'
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Carries the original file name
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/graphql:
    post:
      tags: [GraphQL]
      summary: Run a GraphQL query or mutation
      description: |
        The schema, with ready-made operations and a signed-in demo token, is explored at
        [`/altair`](/altair/). Uploads use the GraphQL multipart request format with the header
        `Apollo-Require-Preflight: true`; at most `UPLOAD_MAX_FILES` files of
        `UPLOAD_MAX_FILE_SIZE_MB` each.

        Queries nested deeper than 8 levels are rejected. A GraphQL error carries
        `extensions.code` and never a stack trace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                variables: { type: object, additionalProperties: true }
                operationName: { type: string }
            example:
              query: 'query experiments { experiments { runId name status triggeredByName } }'
      responses:
        '200':
          description: The GraphQL response; execution errors are reported in `errors`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true, nullable: true }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message: { type: string }
                        extensions:
                          type: object
                          properties:
                            code: { type: string, example: BAD_USER_INPUT }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    RefreshCookie:
      description: '`refreshToken=…; HttpOnly; Path=/api/v1/auth` — the session, unreadable from JavaScript'
      schema: { type: string }

  schemas:
    RegisterInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
          description: Letters, digits and `. _ @ + -`; unique regardless of letter case
          example: jane.doe
        password: { type: string, minLength: 8, maxLength: 128, format: password }
        firstName: { type: string, maxLength: 100, example: Jane }
        lastName: { type: string, maxLength: 100, example: Doe }

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: jane.doe }
        password: { type: string, format: password }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string, example: jane.doe }
        firstName: { type: string, example: Jane }
        lastName: { type: string, example: Doe }
        name: { type: string, example: Jane Doe }
        role: { type: string, enum: [BRS, Admin] }
        roles:
          type: array
          description: What the web app's route guard checks; an `Admin` also holds `BRS`
          items: { type: string, enum: [BRS, Admin] }
        companyName: { type: string, example: BANPU NEXT }

    SessionResponse:
      type: object
      properties:
        status: { type: integer, example: 200 }
        message: { type: string, example: Login successful! Welcome back. }
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            accessToken: { type: string, description: 'JWT for the `Authorization: Bearer` header' }

    Empty:
      type: object
      properties:
        status: { type: integer, example: 200 }
        message: { type: string, example: Logged out successfully. }
        data: { nullable: true, example: null }

    Error:
      type: object
      properties:
        status: { type: integer }
        message: { type: string }
        data: { nullable: true, example: null }
        code:
          type: string
          enum:
            - invalid_request
            - bad_request
            - no_token
            - token_expired
            - token_invalid
            - invalid_credentials
            - forbidden
            - not_found
            - conflict
            - rate_limited
            - payload_too_large
            - internal_error

  responses:
    InvalidRequest:
      description: The body failed validation; `message` names the field
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            { status: 400, message: password must be at least 8 characters, data: null, code: invalid_request }
    Unauthorized:
      description: |
        The access token is missing (`no_token`), expired (`token_expired` — renew it with
        `POST /auth/refresh` and repeat the request) or not acceptable (`token_invalid`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { status: 401, message: Access token has expired., data: null, code: token_expired }
    NotFound:
      description: Nothing is served at this address for this caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { status: 404, message: File not found, data: null, code: not_found }
    RateLimited:
      description: Too many requests from this IP
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            {
              status: 429,
              message: Too many attempts. Please wait a moment and try again.,
              data: null,
              code: rate_limited,
            }

security:
  - bearerAuth: []
