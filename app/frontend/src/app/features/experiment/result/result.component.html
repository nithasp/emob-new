<ng-container *transloco="let t; read: 'index'">
  <div class="card mt-2 container-fluid main_container">
    <div class="row mt-5 justify-content-center mb-3">
      <div class="d-flex justify-content-end align-items-center mb-5 w-100">
        <button
          mat-raised-button
          class="bg-custom-primary btn btn-sm mr-3 d-flex align-items-center"
          (click)="tryToRerunExperiment()"
        >
          <mat-icon class="mr-2">replay</mat-icon>
          {{ t("try_to_rerun") }}
        </button>
        <button
          mat-raised-button
          class="bg-custom-secondary btn btn-sm d-flex align-items-center"
          (click)="downloadPlan()"
        >
          <mat-icon class="mr-2">download</mat-icon>
          {{ t("download_plan") }}
        </button>
      </div>

      <app-result-information class="col-md-5 mb-3"></app-result-information>
      <app-result-dashboard class="col-md-7 mb-3"></app-result-dashboard>

      <div id="filter-result" class="col-md-5">
        <app-result-filter></app-result-filter>
        <app-result-route-table></app-result-route-table>
      </div>

      <app-result-map class="col-md-7"></app-result-map>
    </div>
  </div>
</ng-container>
