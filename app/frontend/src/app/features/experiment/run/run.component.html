<ng-container *transloco="let t; read: 'index'">
  <div class="card mt-2 container-fluid" style="min-height: 100vh">
    <ngx-spinner name="run">
      <p class="h-3">{{ t("wait_a_moment") }} ...</p>
    </ngx-spinner>
    <div class="row mt-5 justify-content-center content">
      <div
        class="experiment-container border-right mt-3"
        [ngClass]="
          navigation.isMapPaneHidden
            ? 'col-md-12'
            : files.preOrderFiles.length > 0
              ? 'col-md-7'
              : 'col-md-6 border-left'
        "
      >
        <ul
          ngbNav
          #nav="ngbNav"
          [(activeId)]="navigation.activeNavId"
          (navChange)="navigation.onNavTabChange()"
          class="nav-tabs justify-content-center"
        >
          <li [ngbNavItem]="1">
            <button ngbNavLink>
              <h3>{{ t("orders_data") }}</h3>
            </button>
            <ng-template ngbNavContent>
              <div class="row card-body">
                <app-run-upload-file class="col-12 p-0"></app-run-upload-file>
                <app-run-order-data
                  class="col-12 p-0"
                  *ngIf="!state.isFilePreview"
                ></app-run-order-data>
              </div>
            </ng-template>
          </li>

          <li [ngbNavItem]="2" [disabled]="!state.isUpload" *ngIf="fleet.hasMyVehicleTypes()">
            <button ngbNavLink [class.nav-link-error]="fleet.vehicleSelectionError">
              <h3>{{ t("vehicle") }}</h3>
            </button>
            <ng-template ngbNavContent>
              <app-run-vehicle></app-run-vehicle>
            </ng-template>
          </li>

          <li
            [ngbNavItem]="3"
            [disabled]="!state.isUpload"
            *ngIf="params.hasDynamicParameters()"
          >
            <button ngbNavLink>
              <h3>{{ t("parameters") }}</h3>
            </button>
            <ng-template ngbNavContent>
              <app-run-parameter></app-run-parameter>
            </ng-template>
          </li>

          <li [ngbNavItem]="4" [disabled]="!state.isUpload || !state.haveValidated">
            <button ngbNavLink>
              <h3>{{ t("validation") }}</h3>
            </button>
            <ng-template ngbNavContent>
              <app-run-validation></app-run-validation>
            </ng-template>
          </li>
        </ul>

        <div [ngbNavOutlet]="nav" class="mt-2"></div>
      </div>

      <app-run-map
        class="col-md-5 openvrp-map-col overflow-hidden"
        [class.collapsed]="navigation.isMapPaneHidden"
        [hidden]="!state.isUpload"
      ></app-run-map>
    </div>
  </div>
</ng-container>
