<ng-container *transloco="let t; read: 'index'">
  <!-- <h1 (click)="log()">log</h1> -->
  <div class="modal-header">
    <h4 class="modal-title" id="modal-title">{{ title }}</h4>
    <button
      type="button"
      class="btn-close"
      aria-label="Close button"
      aria-describedby="modal-title"
      (click)="onCancel()"
    ></button>
  </div>
  
  <div class="modal-body">
    <ng-container *ngIf="!showCategorySelectOnly">
      <p *ngIf="question"><strong>{{ question }}</strong></p>
      <p *ngIf="message">{{ message }}</p>

      <div *ngIf="showRadioOptions" class="mt-3">
        <div class="d-flex gap-2">
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="confirmReplacement"
              id="radioYes"
              value="yes"
              (change)="onRadioChange('yes')"
              [checked]="selectedRadioOption === 'yes'"
            />
            <label class="form-check-label" for="radioYes">
              {{ "yes" | transloco }}
            </label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="confirmReplacement"
              id="radioNo"
              value="no"
              (change)="onRadioChange('no')"
              [checked]="selectedRadioOption === 'no'"
            />
            <label class="form-check-label" for="radioNo">
              {{ "no" | transloco }}
            </label>
          </div>
        </div>
      </div>
    </ng-container>

    <div *ngIf="showCategorySelect" class="mt-3">
      <label for="categorySelect" class="form-label">
        {{ t("select_category_and_add_as_new_file") }}:
      </label>
      <select
        id="categorySelect"
        class="form-select"
        [class.is-invalid]="categoryAlreadyExists"
        [(ngModel)]="selectedCategory"
        (change)="onCategoryChange()"
      >
        <option value="">{{ t("select_category") }}</option>
        <option *ngFor="let category of inputDataKeys" [value]="category">
          {{ category }}
        </option>
      </select>
      <div *ngIf="categoryAlreadyExists" class="invalid-feedback d-block">
        <small>{{ t("a_file_with_this_category_is_already_added") }}</small>
      </div>
    </div>
  </div>
  
  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-outline-secondary"
      (click)="onCancel()"
      [hidden]="disableCancelButton"
    >
      {{ "cancel" | transloco }}
    </button>
    <button
      type="button"
      ngbAutofocus
      mat-raised-button
      class="bg-custom-primary"
      (click)="onConfirm()"
      [disabled]="isConfirmDisabled"
    >
      {{ ("confirm" | transloco) || acceptButton }}
    </button>
  </div>
</ng-container>
