<div class="modal-header">
  <h4 class="modal-title" id="modal-title">{{ title }}</h4>
  <button type="button" class="btn-close" aria-label="Close button" aria-describedby="modal-title"
    (click)="onCancleClick()"></button>
</div>
<div class="modal-body">
  <p>
    <strong>{{ question }}</strong>
  </p>
  <p>
    {{ message }}
  </p>
  <div *ngIf="showRadioOptions" class="mt-3">
    <div class="form-check">
      <input 
        class="form-check-input" 
        type="radio" 
        name="confirmReplacement" 
        id="radioYes" 
        value="yes"
        (change)="onRadioChange('yes')"
        [checked]="selectedRadioOption === 'yes'">
      <label class="form-check-label" for="radioYes">
        {{ "yes" | transloco }}
      </label>
    </div>
    <div class="form-check">
      <input 
        class="form-check-input" 
        type="radio" 
        name="confirmReplacement" 
        id="radioNo" 
        value="no"
        (change)="onRadioChange('no')"
        [checked]="selectedRadioOption === 'no'">
      <label class="form-check-label" for="radioNo">
        {{ "no" | transloco }}
      </label>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="onCancleClick()" [hidden]="disableCancelButton">
    {{ "cancel" | transloco }}
  </button>
  <button 
    type="button" 
    ngbAutofocus 
    mat-raised-button 
    class="bg-custom-primary" 
    (click)="onConfirmClick()"
    [disabled]="isConfirmDisabled()">
    {{ ("confirm" | transloco) || acceptButton }}
  </button>
</div>
