<ng-container *transloco="let t; read: 'index'">
  <div class="mt-3 mb-4 mx-3">
    <div
      class="modal-header p-0"
      style="padding-bottom: 5px !important; margin-bottom: -2px"
    >
      <p mat-dialog-title class="modal-title w-bold text-danger fs-5 m-0">
        {{ t("parameter") }}
      </p>
      <button
        class="btn close-button"
        (click)="onCancleClick()"
        aria-label="Close"
      >
        <mat-icon>clear</mat-icon>
      </button>
    </div>
    <mat-dialog-content class="ml-3">
      <div *ngIf="isLegacyFormat">
        <!-- Data set 1: Old Data Format no translations -->
        <ul>
          <li *ngFor="let item of groupedParameters[0]?.items">
            <span>{{ item.displayName }}</span>
            <span>: {{ item.formattedValue }}</span>
          </li>
        </ul>
      </div>
      <div *ngIf="!isLegacyFormat">
        <!-- Data set 2: New Data Format Grouped by category with translations -->
        <div *ngFor="let group of groupedParameters" class="mb-3">
          <h3  >{{ group.category }}</h3>
          <ul>
            <li *ngFor="let item of group.items">
              <span>{{ item.displayName }}</span>
              <span>: {{ item.formattedValue }}</span>
            </li>
          </ul>
        </div>
      </div>
    </mat-dialog-content>
  </div>
</ng-container>
