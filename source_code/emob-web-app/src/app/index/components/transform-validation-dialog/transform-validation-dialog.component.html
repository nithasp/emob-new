<ng-container *transloco="let t; read: 'validation'">
  <div class="modal-header">
    <div class="d-flex align-items-center gap-2">
      <h2 class="modal-title text-danger m-0 fw-bold">
        {{ t('validation_dialog__title') }}
      </h2>
    </div>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="close()"
    ></button>
  </div>

  <div class="modal-body">
    <div class="validation-table-wrapper" *ngIf="tableRows.length">
      <table class="table validation-table">
        <thead>
          <tr>
            <th>{{ t('validation_table_header_file_name') }}</th>
            <th>{{ t('validation_table_header_message') }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of tableRows">
            <td class="file-name-cell">{{ row.fileName }}</td>
            <td>{{ t(row.type, row.params) }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">
      {{ 'close' | transloco }}
    </button>
  </div>
</ng-container>
