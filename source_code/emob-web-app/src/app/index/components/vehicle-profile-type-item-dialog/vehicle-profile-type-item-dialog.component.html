<div class="modal-header bg-light">
  <h1 class="modal-title">
    {{ type }}
  </h1>
  <button
    type="button"
    class="btn-close"
    aria-label="Close"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body" style="max-height: 70vh; overflow-y: auto">
  <ngx-spinner name="vehicleModal" [fullScreen]="false">
    <p class="h-3">Loading vehicles...</p>
  </ngx-spinner>

  <div
    *ngIf="!isLoading && vehicles.length === 0"
    class="alert alert-info text-center"
  >
    <mat-icon
      class="d-block mx-auto mb-2"
      style="font-size: 48px; width: 48px; height: 48px"
      >info</mat-icon
    >
    <p class="mb-0">No vehicles found for this type and depot.</p>
  </div>

  <div *ngIf="!isLoading && vehicles.length > 0">
    <!-- <div class="alert alert-light border mb-3">
      <div class="row">
        <div class="col-md-12">
          <small class="text-muted">Total Vehicles:</small>
          <strong class="ms-2">{{ vehicles.length }}</strong>
        </div>
      </div>
    </div> -->

    <div *ngFor="let vehicle of vehicles" class="card mb-3 shadow-sm">
      <div class="card-body">
        <h2
          class="card-title h5 mb-3 d-flex justify-content-between align-items-center"
        >
          {{ vehicle.licensePlate }}
        </h2>
        <hr />
        <div class="item-details-info">
          <div class="row">
            <div class="col-12 col-md-6 mb-2">
              <p class="mb-2">
                <strong>Start Depot: </strong>
                <span>{{ vehicle.startDepotId.depotName }}</span>
              </p>
            </div>
            <div class="col-12 col-md-6 mb-2">
              <p class="mb-2">
                <strong>End Depot: </strong>
                <span>{{ vehicle.endDepotId.depotName }}</span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
