<div class="card mt-2 container-fluid main_container" style="min-height: 100vh">
  <ngx-spinner name="configuration">
    <p class="h-3">{{ "wait_a_moment" | transloco }} ...</p>
  </ngx-spinner>
  <div class="row mt-4 mb-4">
    <div class="col-md-12 mb-3 text-right mt-4">
      <div class="d-inline-block" ngbDropdown #myDrop="ngbDropdown">
        <button
          mat-raised-button
          class="me-2 bg-custom-secondary"
          id="dropdownManual"
          ngbDropdownAnchor
          (focus)="myDrop.open()"
        >
          <mat-icon>upload_2</mat-icon>
          {{ "update" | transloco }}
        </button>
        <div ngbDropdownMenu aria-labelledby="dropdownManual">
          <ng-container *ngFor="let depot of configurationsExplorer; trackBy: trackByDepotId">
            <button
              ngbDropdownItem
              *ngIf="depot.depotId"
              disabled
            >
              <mat-icon class="mr-2">folder</mat-icon>
              <span class="text-capitalize font-weight-bold">
                {{ depot.depotName }}
              </span>
            </button>
            <ng-container *ngFor="let fileType of depot.fileType; trackBy: trackByFileType">
              <button
                ngbDropdownItem
                *ngIf="fileType.category"
                class="pl-4"
                disabled
              >
                <mat-icon class="mr-2">folder</mat-icon>
                <span class="text-capitalize font-weight-bold">
                  {{ fileType.category }}
                </span>
              </button>
              <ng-container *ngFor="let child of fileType.children">
                <button
                  ngbDropdownItem
                  (click)="openUploadFile(child.name, child.name, child.type)"
                  class="pl-5"
                >
                  <mat-icon class="icon-file mr-2">insert_drive_file</mat-icon>
                  <span class="text-capitalize">
                    {{ child.name }}
                  </span>
                </button>
              </ng-container>
            </ng-container>
          </ng-container>
        </div>
      </div>
    </div>
    <div
      class="col-md-4 border"
      style="height: 800px; overflow-y: auto; overflow-x: auto"
    >
      <div class="bg-category w-100" style="text-align: center">
        <p class="font-weight-bold text-uppercase h3 p-3">
          {{ "configurations" | transloco }}
        </p>
      </div>
      <mat-tree
        #tree
        [dataSource]="dataSource"
        [childrenAccessor]="childrenAccessor"
      >
        <mat-tree-node
          *matTreeNodeDef="let depot; when: isDepotNode"
          matTreeNodePadding
          [class.active]="depot.depotId === selectedNode"
          style="cursor: pointer"
        >
          <div
            matTreeNodeToggle
            style="display: flex; align-items: center"
            placement="top"
            [ngbTooltip]="depot.depotName"
          >
            <button mat-icon-button matTreeNodeToggle>
              <mat-icon class="mat-icon-rtl-mirror">
                {{ tree.isExpanded(depot) ? "expand_more" : "chevron_right" }}
              </mat-icon>
            </button>
            <div class="icon-category-wrapper">
              <button mat-icon-button matTreeNodeToggle>
                <mat-icon class="mat-icon-rtl-mirror icon-category">
                  folder
                </mat-icon>
              </button>
              <strong>{{ depot.depotName }}</strong>
            </div>
          </div>
        </mat-tree-node>

        <mat-tree-node
          *matTreeNodeDef="let fileType; when: isFileTypeNode"
          matTreeNodePadding
          [class.active]="fileType.category === selectedNode"
          style="cursor: pointer"
        >
          <div
            matTreeNodeToggle
            style="display: flex; align-items: center"
            placement="top"
            [ngbTooltip]="fileType.category"
          >
            <button mat-icon-button matTreeNodeToggle>
              <mat-icon class="mat-icon-rtl-mirror">
                {{ tree.isExpanded(fileType) ? "expand_more" : "chevron_right" }}
              </mat-icon>
            </button>
            <div class="icon-category-wrapper">
              <button mat-icon-button matTreeNodeToggle>
                <mat-icon class="mat-icon-rtl-mirror icon-category">
                  folder
                </mat-icon>
              </button>
              <strong>{{ fileType.category }}</strong>
            </div>
          </div>
        </mat-tree-node>

        <mat-tree-node
          *matTreeNodeDef="let child; when: isChildNode"
          matTreeNodePadding
          [class.active]="child.name === selectedNode"
          style="cursor: pointer"
        >
          <div
            style="display: flex; align-items: center"
            (click)="onChangeFile(child.name, child.type, '')"
            placement="top"
            [ngbTooltip]="child.timestamp"
          >
            <button mat-icon-button disabled>
              <div style="text-align: center">
                <mat-icon class="icon-file">description</mat-icon>
                <div style="font-size: 10px">Excel</div>
              </div>
            </button>
            <div>
              {{ child.name }}
            </div>
          </div>
          <span style="flex-grow: 1"></span>
          <div class="d-inline-block" ngbDropdown #myDrop="ngbDropdown">
            <button mat-icon-button id="dropdown1" (focus)="myDrop.open()">
              <mat-icon>more_vert</mat-icon>
            </button>
            <div
              ngbDropdownMenu
              aria-labelledby="dropdown1"
              x-placement="bottom-left"
              style="margin-left: -100px"
            >
              <button
                ngbDropdownItem
                [hidden]="child.type === 'actualLocation'"
                (click)="openUploadFile(child.category, child.name, child.type)"
              >
                <mat-icon>upload_file</mat-icon>
                {{ "update_file" | transloco }}
              </button>
              <button
                ngbDropdownItem
                (click)="getFileUrl(child.name, child.type, child.blobPath)"
              >
                <mat-icon>download</mat-icon>
                {{ "download" | transloco }}
              </button>
            </div>
          </div>
        </mat-tree-node>
      </mat-tree>
    </div>
    <div class="col-md-8 pl-3 border">
      <div
        class="container-preview"
        *ngIf="!(excelData.length > 0) && !selectedNode"
      >
        <mat-icon
          style="color: gray; font-size: 250px; width: auto; height: auto"
          >folder_open</mat-icon
        >
        <p class="h3" style="color: gray">
          {{ "select_file_to_preview" | transloco }}.
        </p>
      </div>
      <div
        class="container-preview"
        *ngIf="!(excelData.length > 0) && selectedNode"
      >
        <mat-spinner></mat-spinner>
        <p class="h3" style="color: gray">
          {{ "loading_data" | transloco }} ...
        </p>
      </div>

      <div class="table-responsive mb-2" *ngIf="excelData.length > 0">
        <input
          type="text"
          [(ngModel)]="searchText"
          [placeholder]="'search_three_dots' | transloco"
          class="form-control mb-3 mt-4"
        />
        <table
          *ngIf="excelData.length > 0"
          class="table table-striped table-bordered"
        >
          <thead class="thead-dark">
            <tr>
              <th *ngFor="let col of headers" scope="col">{{ col }}</th>
            </tr>
          </thead>
          <tbody>
            <tr
              *ngFor="let row of paginatedData | filter : searchText : headers"
            >
              <td
                *ngFor="let col of headers"
                [ngClass]="{
                  'td-warning':
                    row[col] === null || '' || row[col] === undefined
                }"
              >
                {{ row[col] }}
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <ngb-pagination
        class="mt-3"
        *ngIf="excelData.length > 0 && selectedNode"
        [collectionSize]="excelData.length"
        [(page)]="currentPage"
        [pageSize]="pageSize"
        [maxSize]="5"
        [rotate]="true"
        [boundaryLinks]="true"
      ></ngb-pagination>
    </div>
  </div>
</div>
