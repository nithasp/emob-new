<ng-container *transloco="let t; read: 'vehicleManagement'">
  <div id="vehicle-dialog" class="px-3 py-4 w-100 position-relative" [class.is-loading]="isLoading">

    <div *ngIf="isLoading"
      class="d-flex flex-column align-items-center justify-content-center position-absolute w-100 h-100 bg-white"
      style="z-index:10;top:0;left:0;right:0;bottom:0;">
      <mat-spinner diameter="40"></mat-spinner>
      <p class="mt-3 text-secondary small text-center">{{ t("loading_vehicle_data") }}</p>
    </div>

    <div *ngIf="!isLoading" class="w-100 h-100">
      <div class="modal-header border-0 pb-2">
        <h1 class="fw-bold h4 modal-title">{{
          isViewMode
          ? t("view_vehicle")
          : isEditMode
          ? t("edit_vehicle")
          : t("add_vehicle")
          }}</h1>
      </div>

      <div class="modal-body pb-0">
        <form [formGroup]="form" class="d-flex flex-column gap-3 gap-sm-2 mt-3">
          <app-input-select idAttribute="vehicleTypeId" valueAttribute="name" [placeholder]="t('vehicle_type')"
            [options]="vehicleTypeOptions" [control]="form.controls.vehicleType" [required]="true"
            [disabled]="isViewMode">
          </app-input-select>

          <div class="row g-2">
            <div class="col-12 col-sm-6 mb-2 mb-sm-0">
              <app-input-select idAttribute="depotId" valueAttribute="depotName" [placeholder]="t('start_depot')"
                [options]="startDepotOptions" [control]="form.controls.startDepot" [required]="true"
                [disabled]="isViewMode">
              </app-input-select>
            </div>
            <div class="col-12 col-sm-6">
              <app-input-select idAttribute="depotId" valueAttribute="depotName" [placeholder]="t('end_depot')"
                [options]="endDepotOptions" [control]="form.controls.endDepot" [required]="true"
                [disabled]="isViewMode">
              </app-input-select>
            </div>
          </div>

          <div *ngIf="isEditMode || isViewMode" class="row">
            <div class="col-12">
              <app-input-field class="w-100" [placeholder]="t('license_plate')" [control]="form.controls.licensePlate"
                [required]="true" [disabled]="isViewMode || isEditMode">
              </app-input-field>
            </div>
          </div>

          <div *ngIf="!isEditMode && !isViewMode">
            <div class="row g-2 align-items-stretch">
              <div class="col-12 col-sm flex-grow-1 mb-2 mb-sm-0">
                <app-input-field [placeholder]="t('license_plate')" [control]="form.controls.licensePlate"
                  class="w-100">
                </app-input-field>
              </div>
              <div class="col-12 col-sm-auto flex-grow-1 flex-sm-grow-0">
                <button mat-raised-button class="btn-add-license-plate bg-custom-secondary w-100" type="button"
                  (click)="addLicensePlate()" [disabled]="!form.controls.licensePlate.value">
                  {{ "add" | transloco }}
                </button>
              </div>
            </div>

            <div *ngIf="licensePlates.length > 0" class="bg-light rounded-3 p-3 overflow-auto">
              <div class="row row-cols-1 row-cols-sm-2 g-2">
                <div class="col" *ngFor="let plate of licensePlates; let i = index">
                  <div class="d-flex justify-content-between align-items-center bg-white rounded-2 border p-2">
                    <div class="d-flex align-items-center gap-2">
                      <span class="fs-3 text-dark position-relative" style="top:1px;">•</span>
                      <span class="fw-medium text-dark mt-1 text-break">{{ plate }}</span>
                    </div>
                    <button mat-icon-button color="warn" (click)="removeLicensePlate(i)"
                      style="width:32px;height:32px;margin-top:-12px;">
                      <mat-icon style="font-size:20px;width:20px;height:20px;">close</mat-icon>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer border-0 pt-3">
        <div class="row g-2 m-0 p-0 w-100 justify-content-end">
          <div class="btn-action col-12 col-sm-auto">
            <button type="button" class="btn btn-outline-secondary w-100" (click)="cancel()">
              {{ "cancel" | transloco }}
            </button>
          </div>
          <div class="btn-action col-12 col-sm-auto" *ngIf="!isViewMode">
            <button type="button" class="btn btn-primary w-100" (click)="save()">
              {{ "save" | transloco }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>
