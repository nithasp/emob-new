<div class=" card mt-2 container-fluid"
  style="min-height:650px;">
  <h3 class="text-center mt-5 mb-3">BRS
    <h4 class="text-warning">Inventory</h4>
  </h3>
  <div class="row">
    <div class="col-md-12 mb-3 text-right">
      <button mat-raised-button color="primary">
        <mat-icon>add</mat-icon>
        Replace Inventory
      </button>
    </div>
    <div class="col-md-3">
      <mat-card appearance="outlined" style="height: 100%;">
        <mat-card-header class="bg-primary text-white p-3 justify-content-center">
          <mat-card-title class="font-weight-bold">INVENTORIES</mat-card-title>
        </mat-card-header>
        <mat-card-actions>
          <mat-tree #tree [dataSource]="dataSource"
            [childrenAccessor]="childrenAccessor">
            <!-- This is the tree node template for leaf nodes -->
            <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding style="cursor: pointer;">
              <!-- use a disabled button to provide padding for tree leaf -->
              <button mat-icon-button disabled><mat-icon>description</mat-icon></button>
              {{node.name}}
            </mat-tree-node>
            <!-- This is the tree node template for expandable nodes -->
            <mat-tree-node *matTreeNodeDef="let node;when: hasChild"
              matTreeNodePadding matTreeNodeToggle
              [cdkTreeNodeTypeaheadLabel]="node.name" style="cursor: pointer;">
              <button mat-icon-button matTreeNodeToggle
                [attr.aria-label]="'Toggle ' + node.name" >
                <mat-icon class="mat-icon-rtl-mirror" >
                  {{tree.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                </mat-icon>
              </button>
              <mat-icon class="mr-2">folder</mat-icon>
              {{node.name}}
            </mat-tree-node>
          </mat-tree>
        </mat-card-actions>
      </mat-card>

    </div>
    <div class="col-md-9">
      <section class="example-container mat-elevation-z8" tabindex="0">
        <table mat-table [dataSource]="tableDataSource">

          <!-- Name Column -->
          <ng-container matColumnDef="name" sticky>
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
          </ng-container>

          <!-- Position Column -->
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef> No. </th>
            <td mat-cell *matCellDef="let element"> {{element.position}} </td>
          </ng-container>

          <!-- Weight Column -->
          <ng-container matColumnDef="weight">
            <th mat-header-cell *matHeaderCellDef> Weight </th>
            <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="symbol">
            <th mat-header-cell *matHeaderCellDef> Symbol </th>
            <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
          </ng-container>

          <!-- Star Column -->
          <ng-container matColumnDef="star" stickyEnd>
            <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
            <td mat-cell *matCellDef="let element">
              <mat-icon>more_vert</mat-icon>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </section>
    </div>

  </div>

</div>
