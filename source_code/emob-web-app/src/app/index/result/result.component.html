<div class="card mt-2 container-fluid main_container">
    <div class="row mt-5 justify-content-center">
        <div class="col-md-6">
            
                <table mat-table
                [dataSource]="dataSource" multiTemplateDataRows
                class="mat-elevation-z8">
                @for (column of columnsToDisplay; track column) {
                <ng-container matColumnDef="{{column}}">
                    <th mat-header-cell *matHeaderCellDef> {{column}} </th>
                    <td mat-cell *matCellDef="let element"> {{element[column]}}
                    </td>
                </ng-container>
                }
                <ng-container matColumnDef="expand">
                    <th mat-header-cell *matHeaderCellDef
                        aria-label="row actions">&nbsp;</th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button aria-label="expand row"
                            (click)="(expandedElement = expandedElement === element ? null : element); $event.stopPropagation()">
                            @if (expandedElement === element) {
                            <mat-icon>keyboard_arrow_up</mat-icon>
                            } @else {
                            <mat-icon>keyboard_arrow_down</mat-icon>
                            }
                        </button>
                    </td>
                </ng-container>

                <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
                <div cdkDropListGroup>
                    <ng-container matColumnDef="expandedDetail">
                        <td mat-cell *matCellDef="let element"
                            [attr.colspan]="columnsToDisplayWithExpand.length">
                            <div
                                class="example-element-detail overflow-x-scroll"
                                [@detailExpand]="isExpanded(element)"
                                cdkScrollable>
                                <div>

                                    <div
                                        cdkDropList
                                        [cdkDropListData]="element.DropPoints"
                                        cdkDropListOrientation="horizontal"
                                        class="example-list"
                                        (cdkDropListDropped)="drop($event)">
                                        @for (node of element.DropPoints; track node) {
                                        <div class="example-box" cdkDrag>{{node}}</div>
                                        }
                                    </div>
                                </div>
                            </div>
                        </td>
                    </ng-container>
                </div>
                <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr>
                <tr mat-row
                    *matRowDef="let element; columns: columnsToDisplayWithExpand;"
                    class="example-element-row"
                    [class.example-expanded-row]="expandedElement === element"
                    (click)="toggleRow(element)">
                </tr>
                <tr mat-row *matRowDef="let row; columns: ['expandedDetail']"
                    class="example-detail-row"></tr>
            </table>
            
            
            <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                 showFirstLastButtons
                 aria-label="Select page of periodic elements">
  </mat-paginator>
