<body class="bg-primary w-1000 ml-0 mr-0 mx-auto text-center">
<div class="wrapper fadeInDown ">
    <div id="formContent">
      <!-- Tabs Titles -->
  
      <!-- Icon -->
      <div class="fadeIn first col-lg-6 col-md-6 col-sm-6 container justify-content-center mt-3">
        <img src="assets/image/Banpu_Logo.png" id="icon" alt="User Icon" class="img-fluid" />
      </div>
  
      <!-- Login Form -->
        <form class="m-5" [formGroup]="dataLogin">

            <input type="text" class="fadeIn second" placeholder="login" autoComplete="username" formControlName="username">
            <input type="password" class="fadeIn third" placeholder="password" autoComplete="current-password" formControlName="password">
            <mat-error class="text-danger">@if (errorUser) {invalid username and password}</mat-error>
            <input type="submit" class="fadeIn fourth btn btn-primary bg-primary" value="Log In" color="primary" (click)="onLogin()" >
          </form>
      

  
    </div>
  </div>
</body>
