<mat-form-field appearance="outline">
  <mat-label>{{ placeholder }}</mat-label>
  <mat-select [formControl]="control" [placeholder]="placeholder" [multiple]="multiple">
    <mat-option *ngFor="let option of options" [value]="option[idAttribute]">
      {{ option[valueAttribute] }}
    </mat-option>
  </mat-select>
  <mat-error *ngIf="control && control.invalid && (control.touched || control.dirty)" class="text-red-600">
    {{ getErrorMessage() }}
  </mat-error>
</mat-form-field>
